    <text x="170" y="300" text-anchor="middle" font-weight="bold" fill="#800020">fork</text>
    <text x="460" y="300" text-anchor="middle" font-weight="bold" fill="#800020">join</text>
    <text x="580" y="300" text-anchor="middle" font-weight="bold" fill="#800020">fork</text>
    <text x="840" y="300" text-anchor="middle" font-weight="bold" fill="#800020">join</text>
    <text x="315" y="35" text-anchor="middle">región paralela 1</text>
    <text x="710" y="35" text-anchor="middle">región paralela 2</text>
    <text x="520" y="145" text-anchor="middle">secuencial</text>
