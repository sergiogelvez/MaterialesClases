    <line x1="640" y1="190" x2="780" y2="190"/>
    <line x1="640" y1="250" x2="780" y2="250"/>
    <path d="M780,70 C810,70 810,160 840,160"/>
    <path d="M780,130 C810,130 810,160 840,160"/>
    <path d="M780,190 C810,190 810,160 840,160"/>
    <path d="M780,250 C810,250 810,160 840,160"/>
  </g>
  <line x1="840" y1="160" x2="935" y2="160" stroke="#800020" stroke-width="5" marker-end="url(#a)"/>
