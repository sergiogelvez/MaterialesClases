<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" width="1000" height="265" font-family="'DejaVu Sans Condensed','DejaVu Sans',sans-serif"><defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#590D22"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A4133C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B3A"/></marker><marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><rect width="1000" height="265" fill="#FFFFFF"/><line x1="60" y1="60" x2="940" y2="60" stroke="#590D22" stroke-width="4" marker-end="url(#ad)"/><text x="60" y="30" font-size="16" fill="#590D22" text-anchor="start" font-weight="bold" dominant-baseline="middle">más fuerte: más coordinación, más latencia</text><text x="940" y="30" font-size="16" fill="#A4133C" text-anchor="end" font-weight="bold" dominant-baseline="middle">más débil: más disponibilidad, menos latencia</text><rect x="30" y="90" width="220" height="54" rx="8" fill="#590D22" stroke="#590D22" stroke-width="2"/><text x="140.0" y="117.0" font-size="19" fill="#FFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Linealizable</text><text x="140" y="173.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">como una sola copia</text><text x="140" y="197.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">en tiempo real</text><rect x="270" y="90" width="220" height="54" rx="8" fill="#7B2D3B" stroke="#590D22" stroke-width="2"/><text x="380.0" y="117.0" font-size="19" fill="#FFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Secuencial</text><text x="380" y="173.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">mismo orden para todos,</text><text x="380" y="197.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">no en tiempo real</text><rect x="510" y="90" width="220" height="54" rx="8" fill="#A4133C" stroke="#590D22" stroke-width="2"/><text x="620.0" y="117.0" font-size="19" fill="#FFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Causal</text><text x="620" y="173.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">respeta la causalidad;</text><text x="620" y="197.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">concurrentes en cualquier orden</text><rect x="750" y="90" width="220" height="54" rx="8" fill="#F2C4CE" stroke="#590D22" stroke-width="2"/><text x="860.0" y="117.0" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Eventual</text><text x="860" y="173.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">converge si cesan</text><text x="860" y="197.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">las escrituras</text><text x="140" y="245" font-size="15" fill="#6B6B6B" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="middle">Raft (leer del líder)</text><text x="380" y="245" font-size="15" fill="#6B6B6B" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="middle">seguidores de Raft</text><text x="620" y="245" font-size="15" fill="#6B6B6B" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="middle">CRDT + causal (COPS)</text><text x="860" y="245" font-size="15" fill="#6B6B6B" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="middle">Dynamo, DNS</text></svg>