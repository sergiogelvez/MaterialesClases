" dominant-baseline="middle">escritura: W = 2</text><rect x="405" y="95" width="440" height="120" rx="14" fill="none" stroke="#2E6B3A" stroke-width="3" stroke-dasharray="3 4"/><text x="835" y="232" font-size="17" fill="#2E6B3A" text-anchor="end" font-weight="bold" dominant-baseline="middle">lectura: R = 2</text><text x="500" y="40" font-size="22" fill="#590D22" text-anchor="middle" font-weight="bold" dominant-baseline="middle">N = 3 réplicas · W + R = 4 &gt; N</text><text x="500" y="275" font-size="17" fill="#590D22" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Todo quórum de lectura se solapa con todo quórum de escritura (aquí, en B)</text><text x="500" y="305" font-size="16" fill="#6B6B6B" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="middle">Convergencia: reparación en lectura + antientropía (árboles de Merkle)</text></svg>