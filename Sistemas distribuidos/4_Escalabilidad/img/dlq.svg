<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="'DejaVu Sans Condensed','DejaVu Sans',sans-serif"><defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#590D22"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A4133C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B3A"/></marker><marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><rect width="1000" height="360" fill="#FFFFFF"/><rect x="20" y="100" width="140" height="60" rx="8" fill="#590D22" stroke="#590D22" stroke-width="2"/><text x="90.0" y="130.0" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Productor</text><rect x="210" y="100" width="170" height="60" rx="8" fill="#F2C4CE" stroke="#A4133C" stroke-width="2"/><text x="295.0" y="130.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Cola principal</text><rect x="470" y="100" width="220" height="60" rx="8" fill="#F9F4F5" stroke="#590D22" stroke-width="2"/><text x="580.0" y="120.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Consumidor</text><text x="580.0" y="140.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">(idempotente)</text><line x1="162" y1="130" x2="208" y2="130" stroke="#590D22" stroke-width="2.2" marker-end="url(#ad)"/><line x1="382" y1="130" x2="468" y2="130" stroke="#590D22" stroke-width="2.2" marker-end="url(#ad)"/><text x="425.0" y="115" font-size="16" fill="#590D22" text-anchor="middle" font-weight="normal" dominant-baseline="middle">recibir</text><path d="M580,98 C580,30 300,30 300,96" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/><text x="440" y="30" font-size="14" fill="#6B6B6B" text-anchor="middle" font-weight="normal" dominant-baseline="middle">sin confirmación → reaparece al vencer el tiempo de visibilidad</text><line x1="692" y1="130" x2="798" y2="130" stroke="#2E6B3A" stroke-width="2.2" marker-end="url(#aok)"/><text x="745.0" y="115" font-size="16" fill="#2E6B3A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">ack</text><rect x="800" y="105" width="180" height="50" rx="8" fill="#E3F0E5" stroke="#2E6B3A" stroke-width="2"/><text x="890.0" y="130.0" font-size="16" fill="#2E6B3A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">procesado ✔</text><rect x="210" y="240" width="260" height="60" rx="8" fill="#FBE4E2" stroke="#B3261E" stroke-width="2"/><text x="340.0" y="260.0" font-size="16" fill="#B3261E" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Cola de mensajes muertos</text><text x="340.0" y="280.0" font-size="16" fill="#B3261E" text-anchor="middle" font-weight="bold" dominant-baseline="middle">(DLQ)</text><line x1="295" y1="162" x2="320" y2="236" stroke="#B3261E" stroke-width="2.2" marker-end="url(#abad)"/><text x="330" y="200" font-size="16" fill="#B3261E" text-anchor="start" font-weight="normal" dominant-baseline="middle">tras N intentos fallidos</text><text x="500" y="340" font-size="15" fill="#590D22" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Al menos una vez + consumidor idempotente = efectivamente una vez · mensajes envenenados → DLQ</text></svg>