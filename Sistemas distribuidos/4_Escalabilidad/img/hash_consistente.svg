<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'DejaVu Sans Condensed','DejaVu Sans',sans-serif"><defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#590D22"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A4133C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B3A"/></marker><marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><rect width="1000" height="400" fill="#FFFFFF"/><circle cx="260" cy="200" r="150" fill="none" stroke="#7B2D3B" stroke-width="3"/><circle cx="311.30302149885034" cy="59.04610688211375" r="16" fill="#590D22"/><text x="326.6939279485054" y="16.759938946747866" font-size="16" fill="#590D22" text-anchor="middle" font-weight="bold" dominant-baseline="middle">N1</text><circle cx="356.4181414529809" cy="314.9066664678467" r="16" fill="#590D22"/><text x="385.3435838888752" y="349.37866640820073" font-size="16" fill="#590D22" text-anchor="middle" font-weight="bold" dominant-baseline="middle">N2</text><circle cx="119.04610688211375" cy="251.30302149885034" r="16" fill="#590D22"/><text x="76.75993894674787" y="266.69392794850546" font-size="16" fill="#590D22" text-anchor="middle" font-weight="bold" dominant-baseline="middle">N3</text><circle cx="163.58185854701907" cy="85.09333353215331" r="16" fill="#A4133C"/><text x="134.6564161111248" y="50.6213335917993" font-size="16" fill="#A4133C" text-anchor="middle" font-weight="bold" dominant-baseline="middle">N4 (nuevo)</text><circle cx="389.9038105676658" cy="125.00000000000001" r="7" fill="#F2C4CE" stroke="#590D22"/><text x="363.92304845413264" y="140.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k1</text><circle cx="407.72116295183116" cy="226.04722665003956" r="7" fill="#F2C4CE" stroke="#590D22"/><text x="378.176930361465" y="220.83778132003164" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k2</text><circle cx="233.95277334996047" cy="347.72116295183116" r="7" fill="#F2C4CE" stroke="#590D22"/><text x="239.16221867996836" y="318.176930361465" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k3</text><circle cx="145.0933335321533" cy="296.41814145298093" r="7" fill="#F2C4CE" stroke="#590D22"/><text x="168.07466682572266" y="277.13451316238474" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k4</text><circle cx="119.04610688211375" cy="148.69697850114972" r="7" fill="#A4133C" stroke="#590D22"/><text x="147.236885505691" y="158.95758280091977" font-size="14" fill="#A4133C" text-anchor="middle" font-weight="bold" dominant-baseline="middle">k5</text><circle cx="208.69697850114972" cy="59.04610688211375" r="7" fill="#F2C4CE" stroke="#590D22"/><text x="218.95758280091977" y="87.23688550569099" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k6</text><path d="M92.0,200.00000000000003 A168,168 0 0 1 122.38245655944937,103.63915869302424" fill="none" stroke="#6B6B6B" stroke-width="2" marker-end="url(#ag)"/><text x="720" y="109.5" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Nodos y claves se ubican en un anillo</text><text x="720" y="136.5" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">según su hash.</text><text x="720" y="163.5" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Cada clave pertenece al siguiente nodo</text><text x="720" y="190.5" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="normal" dominant-baseline="middle">en el sentido de las agujas del reloj.</text><rect x="500" y="240" width="460" height="90" rx="8" fill="#F2C4CE" stroke="#A4133C" stroke-width="2"/><text x="730.0" y="265.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Al agregar N4 solo se mueve k5 (de N1 a N4):</text><text x="730.0" y="285.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">≈ 1/N de las claves, no casi todas</text><text x="730.0" y="305.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">como con hash mod N</text></svg>