<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="520" fill="#FFFFFF"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#590D22">Rebanado: v[inicio : fin : paso]</text>

  <text x="470" y="92" text-anchor="middle" font-size="30" font-family="monospace" fill="#1A1A1A">v[ 1 : 5 : 2 ]</text>

  <line x1="378" y1="106" x2="378" y2="140" stroke="#590D22" stroke-width="2"/>
  <text x="378" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#590D22">inicio</text>
  <text x="378" y="180" text-anchor="middle" font-size="13" fill="#3D3D3D">incluido</text>
  <text x="378" y="198" text-anchor="middle" font-size="13" fill="#3D3D3D">por defecto 0</text>

  <line x1="470" y1="106" x2="470" y2="140" stroke="#A4133C" stroke-width="2"/>
  <text x="470" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#A4133C">fin</text>
  <text x="470" y="180" text-anchor="middle" font-size="13" fill="#3D3D3D">EXCLUIDO</text>
  <text x="470" y="198" text-anchor="middle" font-size="13" fill="#3D3D3D">por defecto len(v)</text>

  <line x1="562" y1="106" x2="562" y2="140" stroke="#7B2D3B" stroke-width="2"/>
  <text x="562" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B2D3B">paso</text>
  <text x="562" y="180" text-anchor="middle" font-size="13" fill="#3D3D3D">salto entre índices</text>
  <text x="562" y="198" text-anchor="middle" font-size="13" fill="#3D3D3D">por defecto 1</text>

  <line x1="70" y1="226" x2="870" y2="226" stroke="#E3CBD1" stroke-width="2"/>

  <!-- fila base -->
  <text x="70" y="258" font-size="14" font-weight="bold" fill="#7B2D3B">v = [10, 20, 30, 40, 50, 60]</text>
  <g font-size="13" fill="#A4133C" text-anchor="middle">
    <text x="326" y="258">0</text><text x="396" y="258">1</text><text x="466" y="258">2</text>
    <text x="536" y="258">3</text><text x="606" y="258">4</text><text x="676" y="258">5</text>
  </g>

  <!-- ejemplo 1 -->
  <text x="70" y="304" font-size="16" font-family="monospace" fill="#1A1A1A">v[1:4]</text>
  <g>
    <rect x="291" y="282" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="361" y="282" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="431" y="282" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="501" y="282" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="571" y="282" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="641" y="282" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-family="monospace" text-anchor="middle">
    <text x="326" y="306" fill="#8A7A7E">10</text><text x="396" y="306" fill="#FFFFFF">20</text>
    <text x="466" y="306" fill="#FFFFFF">30</text><text x="536" y="306" fill="#FFFFFF">40</text>
    <text x="606" y="306" fill="#8A7A7E">50</text><text x="676" y="306" fill="#8A7A7E">60</text>
  </g>
  <text x="740" y="306" font-size="15" font-family="monospace" fill="#590D22">[20, 30, 40]</text>

  <!-- ejemplo 2 -->
  <text x="70" y="352" font-size="16" font-family="monospace" fill="#1A1A1A">v[::2]</text>
  <g>
    <rect x="291" y="330" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="361" y="330" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="431" y="330" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="501" y="330" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="571" y="330" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="641" y="330" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-family="monospace" text-anchor="middle">
    <text x="326" y="354" fill="#FFFFFF">10</text><text x="396" y="354" fill="#8A7A7E">20</text>
    <text x="466" y="354" fill="#FFFFFF">30</text><text x="536" y="354" fill="#8A7A7E">40</text>
    <text x="606" y="354" fill="#FFFFFF">50</text><text x="676" y="354" fill="#8A7A7E">60</text>
  </g>
  <text x="740" y="354" font-size="15" font-family="monospace" fill="#590D22">[10, 30, 50]</text>

  <!-- ejemplo 3 -->
  <text x="70" y="400" font-size="16" font-family="monospace" fill="#1A1A1A">v[-2:]</text>
  <g>
    <rect x="291" y="378" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="361" y="378" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="431" y="378" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="501" y="378" width="70" height="34" fill="#FFFFFF" stroke="#D9C0C6" stroke-width="1.5"/>
    <rect x="571" y="378" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
    <rect x="641" y="378" width="70" height="34" fill="#A4133C" stroke="#A4133C" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-family="monospace" text-anchor="middle">
    <text x="326" y="402" fill="#8A7A7E">10</text><text x="396" y="402" fill="#8A7A7E">20</text>
    <text x="466" y="402" fill="#8A7A7E">30</text><text x="536" y="402" fill="#8A7A7E">40</text>
    <text x="606" y="402" fill="#FFFFFF">50</text><text x="676" y="402" fill="#FFFFFF">60</text>
  </g>
  <text x="740" y="402" font-size="15" font-family="monospace" fill="#590D22">[50, 60]</text>

  <!-- ejemplo 4 -->
  <text x="70" y="448" font-size="16" font-family="monospace" fill="#1A1A1A">v[::-1]</text>
  <g>
    <rect x="291" y="426" width="70" height="34" fill="#7B2D3B" stroke="#7B2D3B" stroke-width="1.5"/>
    <rect x="361" y="426" width="70" height="34" fill="#7B2D3B" stroke="#7B2D3B" stroke-width="1.5"/>
    <rect x="431" y="426" width="70" height="34" fill="#7B2D3B" stroke="#7B2D3B" stroke-width="1.5"/>
    <rect x="501" y="426" width="70" height="34" fill="#7B2D3B" stroke="#7B2D3B" stroke-width="1.5"/>
    <rect x="571" y="426" width="70" height="34" fill="#7B2D3B" stroke="#7B2D3B" stroke-width="1.5"/>
    <rect x="641" y="426" width="70" height="34" fill="#7B2D3B" stroke="#7B2D3B" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="326" y="450">10</text><text x="396" y="450">20</text><text x="466" y="450">30</text>
    <text x="536" y="450">40</text><text x="606" y="450">50</text><text x="676" y="450">60</text>
  </g>
  <text x="740" y="450" font-size="14" font-family="monospace" fill="#590D22">orden invertido</text>

  <line x1="70" y1="478" x2="870" y2="478" stroke="#E3CBD1" stroke-width="2"/>
  <text x="70" y="504" font-size="14" fill="#3D3D3D">Un rebanado nunca falla por salirse del rango: v[2:100] simplemente devuelve lo que haya. Un índice suelto, sí.</text>
</svg>
