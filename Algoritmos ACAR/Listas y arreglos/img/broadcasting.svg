<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="500" fill="#FFFFFF"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#590D22">Broadcasting: operar arreglos de formas distintas sin copiarlos</text>

  <!-- caso 1: escalar -->
  <text x="60" y="80" font-size="16" font-weight="bold" fill="#7B2D3B">Caso 1 — arreglo y escalar</text>
  <text x="60" y="106" font-size="15" font-family="monospace" fill="#3D3D3D">a * 2</text>

  <g>
    <rect x="230" y="86" width="46" height="34" fill="#590D22"/>
    <rect x="276" y="86" width="46" height="34" fill="#590D22"/>
    <rect x="322" y="86" width="46" height="34" fill="#590D22"/>
  </g>
  <g font-size="14" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="253" y="109">1</text><text x="299" y="109">2</text><text x="345" y="109">3</text>
  </g>
  <text x="386" y="109" font-size="20" fill="#7B2D3B">×</text>
  <rect x="412" y="86" width="46" height="34" fill="#A4133C"/>
  <text x="435" y="109" text-anchor="middle" font-size="14" font-family="monospace" fill="#FFFFFF">2</text>
  <text x="472" y="109" font-size="20" fill="#7B2D3B">=</text>
  <g>
    <rect x="498" y="86" width="46" height="34" fill="#7B2D3B"/>
    <rect x="544" y="86" width="46" height="34" fill="#7B2D3B"/>
    <rect x="590" y="86" width="46" height="34" fill="#7B2D3B"/>
  </g>
  <g font-size="14" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="521" y="109">2</text><text x="567" y="109">4</text><text x="613" y="109">6</text>
  </g>
  <text x="660" y="109" font-size="13" fill="#3D3D3D">el 2 se "estira" a (3,)</text>

  <line x1="60" y1="142" x2="880" y2="142" stroke="#E3CBD1" stroke-width="1.5"/>

  <!-- caso 2: matriz + fila -->
  <text x="60" y="176" font-size="16" font-weight="bold" fill="#7B2D3B">Caso 2 — matriz (3,4) y vector fila (4,)</text>

  <g>
    <rect x="60" y="196" width="42" height="30" fill="#590D22"/><rect x="102" y="196" width="42" height="30" fill="#590D22"/>
    <rect x="144" y="196" width="42" height="30" fill="#590D22"/><rect x="186" y="196" width="42" height="30" fill="#590D22"/>
    <rect x="60" y="226" width="42" height="30" fill="#590D22"/><rect x="102" y="226" width="42" height="30" fill="#590D22"/>
    <rect x="144" y="226" width="42" height="30" fill="#590D22"/><rect x="186" y="226" width="42" height="30" fill="#590D22"/>
    <rect x="60" y="256" width="42" height="30" fill="#590D22"/><rect x="102" y="256" width="42" height="30" fill="#590D22"/>
    <rect x="144" y="256" width="42" height="30" fill="#590D22"/><rect x="186" y="256" width="42" height="30" fill="#590D22"/>
  </g>
  <text x="144" y="308" text-anchor="middle" font-size="13" font-family="monospace" fill="#7B2D3B">M  (3, 4)</text>

  <text x="248" y="245" font-size="22" fill="#7B2D3B">+</text>

  <g>
    <rect x="288" y="226" width="42" height="30" fill="#A4133C"/><rect x="330" y="226" width="42" height="30" fill="#A4133C"/>
    <rect x="372" y="226" width="42" height="30" fill="#A4133C"/><rect x="414" y="226" width="42" height="30" fill="#A4133C"/>
  </g>
  <text x="372" y="308" text-anchor="middle" font-size="13" font-family="monospace" fill="#7B2D3B">v  (4,)</text>

  <!-- flechas de replicación -->
  <line x1="309" y1="222" x2="309" y2="204" stroke="#A4133C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="309" y1="260" x2="309" y2="278" stroke="#A4133C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="470" y="234" font-size="13" fill="#3D3D3D">v se repite</text>
  <text x="470" y="254" font-size="13" fill="#3D3D3D">en cada fila</text>

  <text x="566" y="245" font-size="22" fill="#7B2D3B">=</text>

  <g>
    <rect x="604" y="196" width="42" height="30" fill="#7B2D3B"/><rect x="646" y="196" width="42" height="30" fill="#7B2D3B"/>
    <rect x="688" y="196" width="42" height="30" fill="#7B2D3B"/><rect x="730" y="196" width="42" height="30" fill="#7B2D3B"/>
    <rect x="604" y="226" width="42" height="30" fill="#7B2D3B"/><rect x="646" y="226" width="42" height="30" fill="#7B2D3B"/>
    <rect x="688" y="226" width="42" height="30" fill="#7B2D3B"/><rect x="730" y="226" width="42" height="30" fill="#7B2D3B"/>
    <rect x="604" y="256" width="42" height="30" fill="#7B2D3B"/><rect x="646" y="256" width="42" height="30" fill="#7B2D3B"/>
    <rect x="688" y="256" width="42" height="30" fill="#7B2D3B"/><rect x="730" y="256" width="42" height="30" fill="#7B2D3B"/>
  </g>
  <text x="688" y="308" text-anchor="middle" font-size="13" font-family="monospace" fill="#7B2D3B">(3, 4)</text>

  <line x1="60" y1="336" x2="880" y2="336" stroke="#E3CBD1" stroke-width="1.5"/>

  <!-- reglas -->
  <text x="60" y="368" font-size="16" font-weight="bold" fill="#7B2D3B">La regla, en dos pasos</text>
  <text x="60" y="396" font-size="15" fill="#1A1A1A">1.  Las formas se comparan de derecha a izquierda; si a una le faltan ejes, se le añaden unos por la izquierda.</text>
  <text x="60" y="422" font-size="15" fill="#1A1A1A">2.  Dos dimensiones son compatibles si son iguales o si una de ellas vale 1. Si no, NumPy lanza ValueError.</text>

  <g font-size="15" font-family="monospace" fill="#3D3D3D">
    <text x="60" y="458">(3, 4)  +  (4,)   →  (3, 4)  ✓</text>
    <text x="360" y="458">(3, 1)  +  (1, 4)  →  (3, 4)  ✓</text>
    <text x="660" y="458">(3, 4)  +  (3,)   ✗</text>
  </g>
  <text x="60" y="486" font-size="14" fill="#3D3D3D">Nada se copia realmente: NumPy recorre el arreglo pequeño con paso cero. Por eso el broadcasting es gratis en memoria.</text>
</svg>
