<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="470" fill="#FFFFFF"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#590D22">El nombre no es la lista: asignar no copia</text>

  <line x1="470" y1="60" x2="470" y2="400" stroke="#E3CBD1" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- Izquierda: alias -->
  <text x="60" y="90" font-size="18" font-weight="bold" fill="#7B2D3B">b = a</text>
  <text x="60" y="114" font-size="14" fill="#3D3D3D">Dos nombres, un solo objeto</text>

  <text x="80" y="176" font-size="18" font-family="monospace" fill="#1A1A1A">a</text>
  <text x="80" y="226" font-size="18" font-family="monospace" fill="#1A1A1A">b</text>

  <line x1="100" y1="170" x2="200" y2="192" stroke="#A4133C" stroke-width="2.5"/>
  <polygon points="204,194 190,188 192,198" fill="#A4133C"/>
  <line x1="100" y1="220" x2="200" y2="204" stroke="#A4133C" stroke-width="2.5"/>
  <polygon points="204,203 190,199 192,209" fill="#A4133C"/>

  <g>
    <rect x="210" y="176" width="52" height="42" fill="#590D22"/>
    <rect x="262" y="176" width="52" height="42" fill="#590D22"/>
    <rect x="314" y="176" width="52" height="42" fill="#590D22"/>
  </g>
  <g font-size="17" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="236" y="203">1</text><text x="288" y="203">2</text><text x="340" y="203">3</text>
  </g>

  <text x="60" y="278" font-size="16" font-family="monospace" fill="#1A1A1A">b[0] = 99</text>
  <g>
    <rect x="210" y="296" width="52" height="42" fill="#A4133C"/>
    <rect x="262" y="296" width="52" height="42" fill="#590D22"/>
    <rect x="314" y="296" width="52" height="42" fill="#590D22"/>
  </g>
  <g font-size="17" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="236" y="323">99</text><text x="288" y="323">2</text><text x="340" y="323">3</text>
  </g>
  <text x="60" y="372" font-size="15" font-weight="bold" fill="#A4133C">a también cambió</text>

  <!-- Derecha: copia -->
  <text x="510" y="90" font-size="18" font-weight="bold" fill="#7B2D3B">b = a.copy()   o   b = a[:]</text>
  <text x="510" y="114" font-size="14" fill="#3D3D3D">Dos objetos independientes</text>

  <text x="530" y="176" font-size="18" font-family="monospace" fill="#1A1A1A">a</text>
  <text x="530" y="266" font-size="18" font-family="monospace" fill="#1A1A1A">b</text>

  <line x1="550" y1="170" x2="646" y2="182" stroke="#A4133C" stroke-width="2.5"/>
  <polygon points="650,183 636,177 638,187" fill="#A4133C"/>
  <line x1="550" y1="260" x2="646" y2="272" stroke="#A4133C" stroke-width="2.5"/>
  <polygon points="650,273 636,267 638,277" fill="#A4133C"/>

  <g>
    <rect x="656" y="166" width="52" height="42" fill="#590D22"/>
    <rect x="708" y="166" width="52" height="42" fill="#590D22"/>
    <rect x="760" y="166" width="52" height="42" fill="#590D22"/>
  </g>
  <g font-size="17" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="682" y="193">1</text><text x="734" y="193">2</text><text x="786" y="193">3</text>
  </g>

  <g>
    <rect x="656" y="256" width="52" height="42" fill="#7B2D3B"/>
    <rect x="708" y="256" width="52" height="42" fill="#7B2D3B"/>
    <rect x="760" y="256" width="52" height="42" fill="#7B2D3B"/>
  </g>
  <g font-size="17" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="682" y="283">1</text><text x="734" y="283">2</text><text x="786" y="283">3</text>
  </g>

  <text x="510" y="340" font-size="16" font-family="monospace" fill="#1A1A1A">b[0] = 99</text>
  <text x="510" y="372" font-size="15" font-weight="bold" fill="#7B2D3B">a queda intacta</text>

  <line x1="60" y1="410" x2="880" y2="410" stroke="#E3CBD1" stroke-width="2"/>
  <text x="60" y="438" font-size="14" fill="#3D3D3D">Cuidado: copy() y a[:] son copias superficiales. Si la lista contiene listas, las internas se siguen compartiendo.</text>
  <text x="60" y="460" font-size="14" fill="#3D3D3D">Para una copia completa hace falta copy.deepcopy(a).</text>
</svg>
