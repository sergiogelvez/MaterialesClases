<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="420" fill="#FFFFFF"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#590D22">Una lista es una secuencia ordenada: cada elemento tiene una posición</text>

  <text x="70" y="86" font-size="18" font-family="monospace" fill="#1A1A1A">v = [3.2, 1.7, 4.8, 0.5, 2.9]</text>

  <!-- índices positivos -->
  <text x="70" y="140" font-size="14" font-weight="bold" fill="#7B2D3B">ÍNDICE POSITIVO — desde el inicio</text>
  <g font-size="16" fill="#A4133C" text-anchor="middle">
    <text x="180" y="176">0</text>
    <text x="300" y="176">1</text>
    <text x="420" y="176">2</text>
    <text x="540" y="176">3</text>
    <text x="660" y="176">4</text>
  </g>

  <!-- celdas -->
  <g>
    <rect x="120" y="190" width="120" height="62" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="240" y="190" width="120" height="62" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="360" y="190" width="120" height="62" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="480" y="190" width="120" height="62" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="600" y="190" width="120" height="62" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
  </g>
  <g font-size="22" font-family="monospace" fill="#1A1A1A" text-anchor="middle">
    <text x="180" y="230">3.2</text>
    <text x="300" y="230">1.7</text>
    <text x="420" y="230">4.8</text>
    <text x="540" y="230">0.5</text>
    <text x="660" y="230">2.9</text>
  </g>

  <!-- índices negativos -->
  <g font-size="16" fill="#7B2D3B" text-anchor="middle">
    <text x="180" y="282">-5</text>
    <text x="300" y="282">-4</text>
    <text x="420" y="282">-3</text>
    <text x="540" y="282">-2</text>
    <text x="660" y="282">-1</text>
  </g>
  <text x="70" y="316" font-size="14" font-weight="bold" fill="#7B2D3B">ÍNDICE NEGATIVO — desde el final</text>

  <line x1="70" y1="344" x2="870" y2="344" stroke="#E3CBD1" stroke-width="2"/>

  <g font-size="16" font-family="monospace" fill="#1A1A1A">
    <text x="70" y="378">v[0]  →  3.2</text>
    <text x="300" y="378">v[-1] →  2.9</text>
    <text x="530" y="378">len(v) →  5</text>
  </g>
  <text x="70" y="404" font-size="14" fill="#3D3D3D">Los índices válidos van de 0 a len(v)-1. Fuera de ese rango, Python lanza IndexError.</text>
</svg>
