<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="540" fill="#FFFFFF"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#590D22">Por qué un ndarray es más rápido: la diferencia está en la memoria</text>

  <!-- LISTA -->
  <text x="60" y="82" font-size="18" font-weight="bold" fill="#7B2D3B">list — arreglo de referencias a objetos dispersos</text>

  <text x="60" y="120" font-size="15" font-family="monospace" fill="#3D3D3D">v = [3.2, 1.7, 4.8, 0.5]</text>

  <g>
    <rect x="60" y="138" width="70" height="40" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="130" y="138" width="70" height="40" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="200" y="138" width="70" height="40" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
    <rect x="270" y="138" width="70" height="40" fill="#F9F4F5" stroke="#7B2D3B" stroke-width="2"/>
  </g>
  <g font-size="13" font-family="monospace" fill="#7B2D3B" text-anchor="middle">
    <text x="95" y="163">ptr</text><text x="165" y="163">ptr</text>
    <text x="235" y="163">ptr</text><text x="305" y="163">ptr</text>
  </g>
  <text x="352" y="163" font-size="13" fill="#3D3D3D">punteros contiguos</text>

  <!-- objetos dispersos -->
  <line x1="95" y1="178" x2="130" y2="236" stroke="#A4133C" stroke-width="1.8"/>
  <line x1="165" y1="178" x2="330" y2="252" stroke="#A4133C" stroke-width="1.8"/>
  <line x1="235" y1="178" x2="70" y2="290" stroke="#A4133C" stroke-width="1.8"/>
  <line x1="305" y1="178" x2="250" y2="300" stroke="#A4133C" stroke-width="1.8"/>

  <g>
    <rect x="96" y="236" width="86" height="34" fill="#590D22"/>
    <text x="139" y="258" text-anchor="middle" font-size="13" fill="#FFFFFF">float 3.2</text>
    <rect x="296" y="252" width="86" height="34" fill="#590D22"/>
    <text x="339" y="274" text-anchor="middle" font-size="13" fill="#FFFFFF">float 1.7</text>
    <rect x="36" y="290" width="86" height="34" fill="#590D22"/>
    <text x="79" y="312" text-anchor="middle" font-size="13" fill="#FFFFFF">float 4.8</text>
    <rect x="216" y="300" width="86" height="34" fill="#590D22"/>
    <text x="259" y="322" text-anchor="middle" font-size="13" fill="#FFFFFF">float 0.5</text>
  </g>

  <text x="36" y="368" font-size="14" fill="#1A1A1A">Cada número es un objeto completo (≈ 24–32 bytes)</text>
  <text x="36" y="390" font-size="14" fill="#1A1A1A">Sumar dos listas obliga a seguir un puntero por elemento,</text>
  <text x="36" y="412" font-size="14" fill="#1A1A1A">comprobar el tipo y crear un objeto nuevo con el resultado.</text>
  <text x="36" y="440" font-size="14" font-weight="bold" fill="#A4133C">El bucle ocurre en el intérprete de Python.</text>

  <line x1="470" y1="60" x2="470" y2="470" stroke="#E3CBD1" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- NDARRAY -->
  <text x="510" y="82" font-size="18" font-weight="bold" fill="#7B2D3B">ndarray — un bloque contiguo y homogéneo</text>

  <text x="510" y="120" font-size="15" font-family="monospace" fill="#3D3D3D">a = np.array([3.2, 1.7, 4.8, 0.5])</text>

  <g>
    <rect x="510" y="138" width="86" height="40" fill="#A4133C"/>
    <rect x="596" y="138" width="86" height="40" fill="#A4133C"/>
    <rect x="682" y="138" width="86" height="40" fill="#A4133C"/>
    <rect x="768" y="138" width="86" height="40" fill="#A4133C"/>
  </g>
  <g font-size="15" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="553" y="164">3.2</text><text x="639" y="164">1.7</text>
    <text x="725" y="164">4.8</text><text x="811" y="164">0.5</text>
  </g>
  <g font-size="12" fill="#7B2D3B" text-anchor="middle">
    <text x="553" y="196">8 bytes</text><text x="639" y="196">8 bytes</text>
    <text x="725" y="196">8 bytes</text><text x="811" y="196">8 bytes</text>
  </g>

  <line x1="510" y1="212" x2="854" y2="212" stroke="#7B2D3B" stroke-width="2"/>
  <text x="682" y="234" text-anchor="middle" font-size="13" fill="#7B2D3B">32 bytes seguidos, dtype = float64</text>

  <text x="510" y="286" font-size="14" font-weight="bold" fill="#7B2D3B">Metadatos, aparte del bloque</text>
  <g font-size="14" font-family="monospace" fill="#1A1A1A">
    <text x="510" y="312">shape  = (4,)</text>
    <text x="510" y="336">dtype  = float64</text>
    <text x="510" y="360">strides = (8,)</text>
  </g>

  <text x="510" y="400" font-size="14" fill="#1A1A1A">El tipo se conoce una sola vez, para todo el bloque.</text>
  <text x="510" y="422" font-size="14" font-weight="bold" fill="#A4133C">El bucle ocurre en código C compilado, sobre datos</text>
  <text x="510" y="444" font-size="14" font-weight="bold" fill="#A4133C">que caben juntos en la caché del procesador.</text>

  <line x1="60" y1="482" x2="880" y2="482" stroke="#E3CBD1" stroke-width="2"/>
  <text x="60" y="512" font-size="14" fill="#3D3D3D">Consecuencia: la lista es flexible y la usamos para construir; el ndarray es rígido y lo usamos para calcular.</text>
</svg>
