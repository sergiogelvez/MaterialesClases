<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="480" fill="#FFFFFF"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#590D22">La misma sintaxis, dos comportamientos distintos</text>

  <line x1="470" y1="60" x2="470" y2="404" stroke="#E3CBD1" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- lista -->
  <text x="60" y="90" font-size="18" font-weight="bold" fill="#7B2D3B">Rebanar una lista devuelve una COPIA</text>

  <text x="60" y="132" font-size="15" font-family="monospace" fill="#1A1A1A">v = [10, 20, 30, 40]</text>
  <g>
    <rect x="60" y="146" width="62" height="38" fill="#590D22"/>
    <rect x="122" y="146" width="62" height="38" fill="#590D22"/>
    <rect x="184" y="146" width="62" height="38" fill="#590D22"/>
    <rect x="246" y="146" width="62" height="38" fill="#590D22"/>
  </g>
  <g font-size="15" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="91" y="171">10</text><text x="153" y="171">20</text>
    <text x="215" y="171">30</text><text x="277" y="171">40</text>
  </g>

  <text x="60" y="220" font-size="15" font-family="monospace" fill="#1A1A1A">w = v[1:3]</text>
  <line x1="153" y1="188" x2="153" y2="234" stroke="#A4133C" stroke-width="2"/>
  <polygon points="153,236 148,224 158,224" fill="#A4133C"/>
  <text x="180" y="212" font-size="13" fill="#A4133C">se duplican los datos</text>

  <g>
    <rect x="122" y="240" width="62" height="38" fill="#7B2D3B"/>
    <rect x="184" y="240" width="62" height="38" fill="#7B2D3B"/>
  </g>
  <g font-size="15" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="153" y="265">20</text><text x="215" y="265">30</text>
  </g>

  <text x="60" y="316" font-size="15" font-family="monospace" fill="#1A1A1A">w[0] = 99</text>
  <text x="60" y="348" font-size="15" font-family="monospace" fill="#3D3D3D">v  →  [10, 20, 30, 40]</text>
  <text x="60" y="380" font-size="15" font-weight="bold" fill="#7B2D3B">v no se entera</text>

  <!-- ndarray -->
  <text x="510" y="90" font-size="18" font-weight="bold" fill="#7B2D3B">Rebanar un ndarray devuelve una VISTA</text>

  <text x="510" y="132" font-size="15" font-family="monospace" fill="#1A1A1A">a = np.array([10, 20, 30, 40])</text>
  <g>
    <rect x="510" y="146" width="62" height="38" fill="#590D22"/>
    <rect x="572" y="146" width="62" height="38" fill="#A4133C"/>
    <rect x="634" y="146" width="62" height="38" fill="#A4133C"/>
    <rect x="696" y="146" width="62" height="38" fill="#590D22"/>
  </g>
  <g font-size="15" font-family="monospace" fill="#FFFFFF" text-anchor="middle">
    <text x="541" y="171">10</text><text x="603" y="171">20</text>
    <text x="665" y="171">30</text><text x="727" y="171">40</text>
  </g>

  <text x="510" y="220" font-size="15" font-family="monospace" fill="#1A1A1A">b = a[1:3]</text>
  <line x1="634" y1="240" x2="634" y2="192" stroke="#A4133C" stroke-width="2"/>
  <polygon points="634,190 629,202 639,202" fill="#A4133C"/>
  <text x="660" y="216" font-size="13" fill="#A4133C">apunta al mismo bloque</text>

  <rect x="572" y="244" width="124" height="34" fill="none" stroke="#A4133C" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="634" y="266" text-anchor="middle" font-size="14" fill="#A4133C">b: ventana sobre a</text>

  <text x="510" y="316" font-size="15" font-family="monospace" fill="#1A1A1A">b[0] = 99</text>
  <text x="510" y="348" font-size="15" font-family="monospace" fill="#3D3D3D">a  →  [10, 99, 30, 40]</text>
  <text x="510" y="380" font-size="15" font-weight="bold" fill="#A4133C">a cambió también</text>

  <line x1="60" y1="416" x2="880" y2="416" stroke="#E3CBD1" stroke-width="2"/>
  <text x="60" y="444" font-size="14" fill="#3D3D3D">Es una decisión de diseño, no un descuido: copiar un arreglo de un millón de elementos en cada rebanado sería carísimo.</text>
  <text x="60" y="468" font-size="14" fill="#3D3D3D">Si necesita datos independientes, pídalos: b = a[1:3].copy()</text>
</svg>
