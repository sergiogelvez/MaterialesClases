  <path d="M 55 155 L 30 155 L 30 258 L 303 258 L 303 121 L 320 121" stroke="#A4133C" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#a4)"/>
  <text x="166" y="272" text-anchor="middle" fill="#A4133C" font-size="10">quien sale por la izquierda reaparece por la derecha</text>
  <path d="M 213 30 L 213 14 L 350 14" stroke="#A4133C" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
  <path d="M 350 14 L 350 250 L 213 250 L 213 246" stroke="#A4133C" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#a4)"/>

  <rect x="380" y="36" width="300" height="112" rx="8" fill="#FFF0F3" stroke="#A4133C" stroke-width="1.4"/>
  <text x="530" y="58" text-anchor="middle" fill="#590D22" font-size="13" font-weight="bold">Estados posibles de una celda</text>
  <rect x="398" y="70" width="20" height="20" fill="#FFFFFF" stroke="#7B2D3B"/>
  <text x="430" y="85" fill="#333333" font-size="12">VACÍA</text>
  <circle cx="408" cy="108" r="9" fill="#28A745"/>
  <text x="430" y="113" fill="#333333" font-size="12">PRESA (edad)</text>
  <polygon points="408,126 417,142 399,142" fill="#590D22"/>
  <text x="430" y="140" fill="#333333" font-size="12">DEPREDADOR (edad, energía)</text>

  <rect x="380" y="160" width="300" height="80" rx="8" fill="#590D22"/>
  <text x="530" y="182" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">Frontera periódica</text>
  <text x="530" y="202" text-anchor="middle" fill="#F2C4CE" font-size="11">vecino(i, j) = ( (i ± 1 + N) mod N ,</text>
  <text x="530" y="219" text-anchor="middle" fill="#F2C4CE" font-size="11">(j ± 1 + M) mod M )</text>
  <text x="530" y="235" text-anchor="middle" fill="#D4A0AA" font-size="10">Sin bordes: ninguna celda es un caso especial.</text>

  <text x="530" y="266" text-anchor="middle" fill="#6B7280" font-size="11">Una celda alberga a lo sumo un individuo:</text>
  <text x="530" y="282" text-anchor="middle" fill="#6B7280" font-size="11">el espacio mismo limita la población.</text>
</svg>
