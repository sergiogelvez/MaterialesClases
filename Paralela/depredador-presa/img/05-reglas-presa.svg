<svg width="720" height="350" viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7B2D3B"/>
    </marker>
  </defs>

  <rect x="16" y="14" width="688" height="30" rx="6" fill="#28A745"/>
  <text x="360" y="34" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Turno de una PRESA — se ejecuta una sola vez por generación</text>

  <rect x="250" y="58" width="220" height="34" rx="6" fill="#FFF0F3" stroke="#A4133C" stroke-width="1.4"/>
  <text x="360" y="80" text-anchor="middle" fill="#590D22" font-size="12">edad ← edad + 1</text>
  <line x1="360" y1="92" x2="360" y2="108" stroke="#7B2D3B" stroke-width="1.8" marker-end="url(#a5)"/>

  <polygon points="360,112 500,146 360,180 220,146" fill="#F9E3E8" stroke="#A4133C" stroke-width="1.5"/>
  <text x="360" y="142" text-anchor="middle" fill="#590D22" font-size="12" font-weight="bold">¿hay alguna celda</text>
  <text x="360" y="158" text-anchor="middle" fill="#590D22" font-size="12" font-weight="bold">vecina VACÍA?</text>

  <line x1="220" y1="146" x2="140" y2="146" stroke="#7B2D3B" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="180" y="138" text-anchor="middle" fill="#E5383B" font-size="11" font-weight="bold">no</text>
  <rect x="20" y="126" width="116" height="40" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/>
  <text x="78" y="143" text-anchor="middle" fill="#333333" font-size="11">permanece donde</text>
  <text x="78" y="158" text-anchor="middle" fill="#333333" font-size="11">está (sin moverse)</text>

  <line x1="500" y1="146" x2="560" y2="146" stroke="#7B2D3B" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="530" y="138" text-anchor="middle" fill="#1E7E34" font-size="11" font-weight="bold">sí</text>
  <rect x="564" y="122" width="140" height="48" rx="6" fill="#F5FBF6" stroke="#28A745" stroke-width="1.4"/>
  <text x="634" y="140" text-anchor="middle" fill="#1E7E34" font-size="11" font-weight="bold">MOVERSE</text>
  <text x="634" y="157" text-anchor="middle" fill="#333333" font-size="10">elige una al azar</text>

  <line x1="634" y1="170" x2="634" y2="196" stroke="#7B2D3B" stroke-width="1.8" marker-end="url(#a5)"/>
  <polygon points="634,200 744,232 634,264 524,232" fill="#F9E3E8" stroke="#A4133C" stroke-width="1.5"/>
  <text x="634" y="228" text-anchor="middle" fill="#590D22" font-size="11" font-weight="bold">¿se cumple la regla</text>
  <text x="634" y="243" text-anchor="middle" fill="#590D22" font-size="11" font-weight="bold">de REPRODUCCIÓN?</text>

  <line x1="524" y1="232" x2="450" y2="232" stroke="#7B2D3B" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="487" y="224" text-anchor="middle" fill="#1E7E34" font-size="11" font-weight="bold">sí</text>
  <rect x="286" y="208" width="160" height="48" rx="6" fill="#F5FBF6" stroke="#28A745" stroke-width="1.4"/>
  <text x="366" y="226" text-anchor="middle" fill="#1E7E34" font-size="11" font-weight="bold">deja una cría</text>
  <text x="366" y="243" text-anchor="middle" fill="#333333" font-size="10">en la celda que abandonó · edad ← 0</text>

  <rect x="16" y="284" width="688" height="56" rx="8" fill="#590D22"/>
  <text x="360" y="305" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">La presa no busca alimento: se supone recurso ilimitado. Solo la depredación y el espacio la limitan.</text>
  <text x="360" y="327" text-anchor="middle" fill="#F2C4CE" font-size="11">La condición de reproducción es un punto de extensión: edad umbral, probabilidad fija, dependencia de la densidad local…</text>
</svg>
