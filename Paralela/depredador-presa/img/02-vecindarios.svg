  <rect x="30" y="266" width="660" height="34" rx="8" fill="#590D22"/>
  <text x="360" y="288" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">La elección del vecindario es una decisión de modelado: cambia la dinámica del sistema, no solo la implementación.</text>
