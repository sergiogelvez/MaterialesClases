<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="a10" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#A4133C"/>
    </marker>
  </defs>

  <rect x="14" y="14" width="336" height="270" rx="8" fill="#FFF0F3" stroke="#A4133C" stroke-width="1.6"/>
  <text x="182" y="38" text-anchor="middle" fill="#590D22" font-size="13" font-weight="bold">Actualización SÍNCRONA (doble búfer)</text>

  <rect x="40" y="52" width="110" height="90" rx="6" fill="#FFFFFF" stroke="#7B2D3B" stroke-width="1.4"/>
  <text x="95" y="72" text-anchor="middle" fill="#7B2D3B" font-size="11" font-weight="bold">grilla_actual</text>
  <text x="95" y="90" text-anchor="middle" fill="#6B7280" font-size="10">solo LECTURA</text>
  <g stroke="#C9B7BB" fill="#F9E3E8">
    <rect x="56" y="98" width="18" height="18"/><rect x="74" y="98" width="18" height="18"/><rect x="92" y="98" width="18" height="18"/><rect x="110" y="98" width="18" height="18"/>
    <rect x="56" y="116" width="18" height="18"/><rect x="74" y="116" width="18" height="18"/><rect x="92" y="116" width="18" height="18"/><rect x="110" y="116" width="18" height="18"/>
  </g>

  <line x1="154" y1="97" x2="208" y2="97" stroke="#A4133C" stroke-width="2" marker-end="url(#a10)"/>
  <text x="181" y="90" text-anchor="middle" fill="#A4133C" font-size="10">regla</text>

  <rect x="212" y="52" width="110" height="90" rx="6" fill="#FFFFFF" stroke="#7B2D3B" stroke-width="1.4"/>
  <text x="267" y="72" text-anchor="middle" fill="#7B2D3B" font-size="11" font-weight="bold">grilla_nueva</text>
  <text x="267" y="90" text-anchor="middle" fill="#6B7280" font-size="10">solo ESCRITURA</text>
  <g stroke="#C9B7BB" fill="#FFFFFF">
    <rect x="228" y="98" width="18" height="18"/><rect x="246" y="98" width="18" height="18"/><rect x="264" y="98" width="18" height="18"/><rect x="282" y="98" width="18" height="18"/>
    <rect x="228" y="116" width="18" height="18"/><rect x="246" y="116" width="18" height="18"/><rect x="264" y="116" width="18" height="18"/><rect x="282" y="116" width="18" height="18"/>
  </g>

  <path d="M 267 146 L 267 162 L 95 162 L 95 148" stroke="#A4133C" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#a10)"/>
  <text x="181" y="176" text-anchor="middle" fill="#A4133C" font-size="10">al terminar la generación: intercambiar punteros</text>

  <text x="34" y="200" fill="#1E7E34" font-size="11">+ El resultado no depende del orden de barrido</text>
  <text x="34" y="218" fill="#1E7E34" font-size="11">+ Reproducible: misma semilla, misma historia</text>
  <text x="34" y="236" fill="#E5383B" font-size="11">− Duplica la memoria</text>
  <text x="34" y="254" fill="#E5383B" font-size="11">− Hay que resolver conflictos: dos individuos</text>
  <text x="46" y="270" fill="#E5383B" font-size="11">pueden elegir la misma celda destino</text>

  <rect x="370" y="14" width="336" height="270" rx="8" fill="#FFFFFF" stroke="#7B2D3B" stroke-width="1.6"/>
  <text x="538" y="38" text-anchor="middle" fill="#590D22" font-size="13" font-weight="bold">Actualización ASÍNCRONA (en sitio)</text>

  <rect x="440" y="52" width="196" height="90" rx="6" fill="#F9E3E8" stroke="#7B2D3B" stroke-width="1.4"/>
  <text x="538" y="72" text-anchor="middle" fill="#7B2D3B" font-size="11" font-weight="bold">una sola grilla</text>
  <text x="538" y="90" text-anchor="middle" fill="#6B7280" font-size="10">se lee y se escribe sobre ella</text>
  <g stroke="#C9B7BB" fill="#FFFFFF">
    <rect x="470" y="98" width="18" height="18" fill="#A4133C"/><rect x="488" y="98" width="18" height="18"/><rect x="506" y="98" width="18" height="18" fill="#F4ACB7"/><rect x="524" y="98" width="18" height="18"/><rect x="542" y="98" width="18" height="18"/><rect x="560" y="98" width="18" height="18"/>
    <rect x="470" y="116" width="18" height="18"/><rect x="488" y="116" width="18" height="18" fill="#F4ACB7"/><rect x="506" y="116" width="18" height="18"/><rect x="524" y="116" width="18" height="18"/><rect x="542" y="116" width="18" height="18"/><rect x="560" y="116" width="18" height="18"/>
  </g>
  <text x="538" y="156" text-anchor="middle" fill="#333333" font-size="10">cada individuo actúa cuando le llega el turno</text>
  <text x="538" y="172" text-anchor="middle" fill="#A4133C" font-size="10">y ya ve los efectos de quienes actuaron antes</text>

  <text x="390" y="200" fill="#1E7E34" font-size="11">+ Sin memoria extra ni conflictos de destino</text>
  <text x="390" y="218" fill="#1E7E34" font-size="11">+ Más natural para agentes que se mueven</text>
  <text x="390" y="236" fill="#E5383B" font-size="11">− El orden de barrido sesga el resultado</text>
  <text x="390" y="254" fill="#333333" font-size="11">Remedio: recorrer los individuos en orden</text>
  <text x="402" y="270" fill="#333333" font-size="11">aleatorio distinto en cada generación</text>

  <rect x="14" y="298" width="692" height="52" rx="8" fill="#590D22"/>
  <text x="360" y="320" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">Decida esto antes de escribir la primera línea de código: es una decisión de modelo, no de programación.</text>
  <text x="360" y="341" text-anchor="middle" fill="#F2C4CE" font-size="11">Dos implementaciones correctas con esquemas distintos producirán series de población distintas. Y ambas serán válidas.</text>
</svg>
