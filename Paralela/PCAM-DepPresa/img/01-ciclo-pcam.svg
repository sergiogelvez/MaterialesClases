  <path d="M 380 60 Q 470 80 520 118" stroke="#A4133C" stroke-width="2.2" fill="none" marker-end="url(#a1)"/>
  <path d="M 555 178 Q 530 240 490 282" stroke="#A4133C" stroke-width="2.2" fill="none" marker-end="url(#a1)"/>
