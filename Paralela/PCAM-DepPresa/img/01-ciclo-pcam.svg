  </defs>
  <rect x="270" y="12" width="160" height="58" rx="8" fill="#590D22"/>
  <text x="350" y="36" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">P</text>
  <text x="350" y="55" text-anchor="middle" fill="#F2C4CE" font-size="11">Partición</text>

  <rect x="490" y="120" width="170" height="58" rx="8" fill="#7B2D3B"/>
  <text x="575" y="144" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">C</text>
