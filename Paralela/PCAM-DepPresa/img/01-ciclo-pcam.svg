  <text x="200" y="94" fill="#6B7280" font-size="10">reconsiderar la partición</text>

  <rect x="14" y="200" width="672" height="60" rx="8" fill="#FFF0F3" stroke="#A4133C" stroke-width="1.4"/>
  <text x="350" y="222" text-anchor="middle" fill="#590D22" font-size="12" font-weight="bold">Las cuatro etapas de Foster (1995) — no es un proceso rígido</text>
  <text x="350" y="242" text-anchor="middle" fill="#333333" font-size="11">Se avanza y se retrocede: una mala aglomeración puede obligar a reconsiderar la partición.</text>
