  <rect x="120" y="280" width="180" height="58" rx="8" fill="#7B2D3B"/>
  <text x="210" y="304" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">M</text>
  <text x="210" y="323" text-anchor="middle" fill="#F2C4CE" font-size="11">Mapeo</text>

  <rect x="40" y="120" width="170" height="58" rx="8" fill="#590D22"/>
