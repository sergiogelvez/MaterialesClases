<svg width="720" height="330" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="a7" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7B2D3B"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" fill="#7B2D3B" font-size="14" font-weight="bold">La granularidad óptima depende del costo de comunicar</text>

  <line x1="60" y1="200" x2="660" y2="200" stroke="#333333" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="660" y="222" text-anchor="middle" fill="#333333" font-size="11">grano más grueso →</text>
  <text x="60" y="222" fill="#333333" font-size="11">← grano más fino</text>

  <circle cx="150" cy="200" r="7" fill="#28A745"/>
  <text x="150" y="176" text-anchor="middle" fill="#1E7E34" font-size="11" font-weight="bold">memoria compartida</text>
  <text x="150" y="240" text-anchor="middle" fill="#333333" font-size="10">latencia de sincronización: nanosegundos</text>
  <text x="150" y="256" text-anchor="middle" fill="#333333" font-size="10">grano fino es rentable — incluso una celda</text>

  <circle cx="560" cy="200" r="7" fill="#590D22"/>
  <text x="560" y="176" text-anchor="middle" fill="#590D22" font-size="11" font-weight="bold">memoria distribuida</text>
  <text x="560" y="240" text-anchor="middle" fill="#333333" font-size="10">latencia de red: microsegundos a milisegundos</text>
  <text x="560" y="256" text-anchor="middle" fill="#333333" font-size="10">exige subdominios grandes por proceso</text>

  <rect x="30" y="272" width="660" height="46" rx="8" fill="#FFF0F3" stroke="#A4133C" stroke-width="1.4"/>
  <text x="360" y="299" text-anchor="middle" fill="#590D22" font-size="11" font-weight="bold">Regla práctica: agrupe hasta que el tiempo de cómputo del bloque domine claramente el tiempo de comunicar su halo.</text>
</svg>
