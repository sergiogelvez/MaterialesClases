<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <text x="180" y="24" text-anchor="middle" fill="#7B2D3B" font-size="14" font-weight="bold">Memoria compartida: mapeo dinámico</text>
  <g stroke="#7B2D3B" stroke-width="1" fill="#FFF0F3">
    <rect x="50" y="40" width="52" height="30"/><rect x="102" y="40" width="52" height="30" fill="#F9E3E8"/><rect x="154" y="40" width="52" height="30"/><rect x="206" y="40" width="52" height="30" fill="#F9E3E8"/><rect x="258" y="40" width="52" height="30"/>
    <rect x="50" y="70" width="52" height="30" fill="#F9E3E8"/><rect x="102" y="70" width="52" height="30"/><rect x="154" y="70" width="52" height="30" fill="#F9E3E8"/><rect x="206" y="70" width="52" height="30"/><rect x="258" y="70" width="52" height="30" fill="#F9E3E8"/>
  </g>
  <text x="180" y="130" text-anchor="middle" fill="#333333" font-size="10">bloques pequeños en una cola de trabajo</text>
  <rect x="50" y="150" width="260" height="34" rx="6" fill="#590D22"/>
  <text x="180" y="172" text-anchor="middle" fill="#FFFFFF" font-size="10">planificador del entorno de ejecución</text>
  <path d="M 90 184 L 75 210" stroke="#7B2D3B" stroke-width="1.6"/>
  <path d="M 180 184 L 180 210" stroke="#7B2D3B" stroke-width="1.6"/>
  <path d="M 270 184 L 285 210" stroke="#7B2D3B" stroke-width="1.6"/>
  <rect x="40" y="212" width="80" height="34" rx="6" fill="#F9E3E8" stroke="#A4133C"/><text x="80" y="233" text-anchor="middle" fill="#590D22" font-size="10">hilo 0</text>
  <rect x="140" y="212" width="80" height="34" rx="6" fill="#F9E3E8" stroke="#A4133C"/><text x="180" y="233" text-anchor="middle" fill="#590D22" font-size="10">hilo 1</text>
  <rect x="245" y="212" width="80" height="34" rx="6" fill="#F9E3E8" stroke="#A4133C"/><text x="285" y="233" text-anchor="middle" fill="#590D22" font-size="10">hilo 2</text>
  <text x="180" y="272" text-anchor="middle" fill="#1E7E34" font-size="10" font-weight="bold">se reparte solo mientras haya trabajo</text>
  <text x="180" y="288" text-anchor="middle" fill="#333333" font-size="10">— compensa el desbalance espacial</text>

  <line x1="360" y1="40" x2="360" y2="300" stroke="#F4ACB7" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="540" y="24" text-anchor="middle" fill="#7B2D3B" font-size="14" font-weight="bold">Memoria distribuida: mapeo estático</text>
  <g stroke="#7B2D3B" stroke-width="1" fill="#FFF0F3">
    <rect x="410" y="40" width="130" height="60"/><rect x="540" y="40" width="130" height="60" fill="#F9E3E8"/>
    <rect x="410" y="100" width="130" height="60" fill="#F9E3E8"/><rect x="540" y="100" width="130" height="60"/>
  </g>
  <text x="475" y="74" text-anchor="middle" fill="#590D22" font-size="10">proceso 0</text>
  <text x="605" y="74" text-anchor="middle" fill="#590D22" font-size="10">proceso 1</text>
  <text x="475" y="134" text-anchor="middle" fill="#590D22" font-size="10">proceso 2</text>
  <text x="605" y="134" text-anchor="middle" fill="#590D22" font-size="10">proceso 3</text>
  <text x="540" y="182" text-anchor="middle" fill="#333333" font-size="10">un subdominio fijo por proceso,</text>
  <text x="540" y="198" text-anchor="middle" fill="#333333" font-size="10">decidido antes de arrancar</text>
  <text x="540" y="230" text-anchor="middle" fill="#590D22" font-size="10" font-weight="bold">redistribuir datos entre procesos</text>
  <text x="540" y="246" text-anchor="middle" fill="#590D22" font-size="10" font-weight="bold">cuesta una comunicación completa</text>
  <text x="540" y="272" text-anchor="middle" fill="#333333" font-size="10">→ el balanceo se hace por sobre-</text>
  <text x="540" y="288" text-anchor="middle" fill="#333333" font-size="10">descomposición, no por reasignación viva</text>

  <rect x="30" y="316" width="660" height="34" rx="8" fill="#FFF0F3" stroke="#A4133C" stroke-width="1.4"/>
  <text x="360" y="338" text-anchor="middle" fill="#590D22" font-size="11" font-weight="bold">Ambas resuelven el mismo problema — el desbalance de carga — con herramientas de costo muy distinto.</text>
</svg>
