<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="360" fill="#ffffff"/>
  <!-- memoria compartida -->
  <rect x="40" y="30" width="880" height="110" rx="10" fill="#f6ecee" stroke="#800020" stroke-width="2.5"/>
  <text x="60" y="58" font-size="17" font-weight="bold" fill="#800020">Memoria compartida (shared)</text>
  <rect x="330" y="72" width="130" height="46" rx="6" fill="#800020"/>
  <text x="395" y="101" font-size="17" fill="#fff" text-anchor="middle" font-family="monospace">a[N]</text>
  <rect x="500" y="72" width="130" height="46" rx="6" fill="#800020"/>
  <text x="565" y="101" font-size="17" fill="#fff" text-anchor="middle" font-family="monospace">suma</text>
  <!-- hilos -->
  <g font-size="15" text-anchor="middle">
    <g>
      <rect x="40" y="220" width="190" height="110" rx="10" fill="#fff" stroke="#800020" stroke-width="2"/>
      <text x="135" y="245" font-weight="bold" fill="#333">Hilo 0 · pila</text>
      <rect x="75" y="262" width="120" height="40" rx="6" fill="#fbf6f7" stroke="#800020" stroke-dasharray="5,4"/>
      <text x="135" y="287" font-family="monospace" fill="#5a0016">tmp, i</text>
    </g>
    <g>
      <rect x="270" y="220" width="190" height="110" rx="10" fill="#fff" stroke="#800020" stroke-width="2"/>
      <text x="365" y="245" font-weight="bold" fill="#333">Hilo 1 · pila</text>
      <rect x="305" y="262" width="120" height="40" rx="6" fill="#fbf6f7" stroke="#800020" stroke-dasharray="5,4"/>
      <text x="365" y="287" font-family="monospace" fill="#5a0016">tmp, i</text>
    </g>
    <g>
      <rect x="500" y="220" width="190" height="110" rx="10" fill="#fff" stroke="#800020" stroke-width="2"/>
      <text x="595" y="245" font-weight="bold" fill="#333">Hilo 2 · pila</text>
      <rect x="535" y="262" width="120" height="40" rx="6" fill="#fbf6f7" stroke="#800020" stroke-dasharray="5,4"/>
      <text x="595" y="287" font-family="monospace" fill="#5a0016">tmp, i</text>
    </g>
    <g>
      <rect x="730" y="220" width="190" height="110" rx="10" fill="#fff" stroke="#800020" stroke-width="2"/>
      <text x="825" y="245" font-weight="bold" fill="#333">Hilo 3 · pila</text>
      <rect x="765" y="262" width="120" height="40" rx="6" fill="#fbf6f7" stroke="#800020" stroke-dasharray="5,4"/>
      <text x="825" y="287" font-family="monospace" fill="#5a0016">tmp, i</text>
    </g>
  </g>
  <!-- flechas de acceso -->
  <g stroke="#800020" stroke-width="2" fill="none" opacity="0.8">
    <line x1="135" y1="220" x2="395" y2="118"/>
    <line x1="365" y1="220" x2="420" y2="118"/>
    <line x1="595" y1="220" x2="540" y2="118"/>
    <line x1="825" y1="220" x2="600" y2="118"/>
    <line x1="135" y1="220" x2="520" y2="118"/>
    <line x1="825" y1="220" x2="440" y2="118"/>
  </g>
  <text x="480" y="352" font-size="14" fill="#555" text-anchor="middle">Todos los hilos ven las variables compartidas; cada uno tiene su propia copia de las privadas</text>
</svg>
